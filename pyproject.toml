# pyproject.toml
#
# The settings of the Python tools; commit-checks is one script, not a package,
# and needs nothing beyond the standard library, so a commit never waits for an install.
# A hook runs under the python3 of each machine that commits,
# so ruff and mypy check the code as Python 3.10, the oldest that it supports.
# ruff takes the profile that every Python project of the maintainer copies:
# every rule group below, with its preview rules, a line length of 99 and numpy docstrings.
# mypy runs in its strictest mode.

# The tools of make check and of the git hooks, which uv.lock pins;
# bats comes from the system, since PyPI has no package of it.
# There is no [project] table, since there is no package to build or install.
[dependency-groups]
dev = [
  "actionlint-py>=1.7.12.25",
  "hypothesis>=6.170.14",
  "mypy>=2.4.1",
  "pre-commit>=4.7.0",
  "pytest>=9.2.0",
  "rumdl>=0.3.2",
  "ruff>=0.17.3",
  "shellcheck-py>=0.11.0.1",
  "shfmt-py>=4.2.0",
  "zizmor>=1.31.1",
]

[tool.uv]
# The tools run under the Python of .python-version alone,
# so uv.lock holds one version of each, for that Python.
# A bound such as >= 3.14 would equal the requires-python that uv derives from it,
# and uv would then find the lock out of date at each run.
environments = ["python_version == '3.14'"]

[tool.ruff]
# The oldest Python that a hook meets, where the profile says py314.
target-version = "py310"
line-length = 99

[tool.ruff.lint]
preview = true
select = [
  "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "COM", "D", "DOC",
  "DTZ", "E", "EM", "ERA", "EXE", "F", "FBT", "FURB", "G", "I", "INP",
  "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "Q",
  "RET", "RSE", "RUF", "S", "SIM", "SLF", "SLOT", "T10", "T20", "TC",
  "TID", "TRY", "UP", "W",
]
# Every other ignore carries a comment with its reason, as this one does.
ignore = [
  "missing-trailing-comma", # The formatter handles trailing commas.
]

[tool.ruff.lint.per-file-ignores]
# A script, not a package: a file name with hyphens, and no __init__.py.
"commit-checks.py" = ["implicit-namespace-package", "invalid-module-name"]
# The unit tests are no package, check with assert as pytest wants,
# take the values of hypothesis by name, and test the numbers of the limits themselves.
"tests/unit/*.py" = [
  "implicit-namespace-package",
  "assert",
  "boolean-type-hint-positional-argument",
  "magic-value-comparison",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest]
testpaths = ["tests/unit"]
strict = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-cast", "truthy-bool"]
