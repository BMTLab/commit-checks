# pyproject.toml
#
# The settings of the Python tools; commit-checks is one script, not a package,
# and needs nothing beyond the standard library, so a commit never waits for an install.
# ruff follows the ScriptsLib profile of gaming-mode:
# every rule group listed there, preview, line length 99, numpy docstrings.
# mypy runs in its strictest mode.

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
preview = true
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "COM", "D", "DTZ", "E", "EM", "ERA",
    "EXE", "F", "FBT", "FURB", "G", "I", "INP", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL",
    "PT", "PTH", "PYI", "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "SLOT", "T10", "T20", "TC",
    "TID", "TRY", "UP", "W", "DOC",
]
ignore = [
    "COM812",  # trailing commas: the formatter decides
    "ISC001",  # implicit string concatenation: the formatter decides
    "DOC201",  # a Returns section for every simple function is noise
]

[tool.ruff.lint.per-file-ignores]
# A script, not a package: a file name with hyphens, and no __init__.py.
"commit-checks.py" = ["INP001", "N999"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-returns = 6
max-branches = 10

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-cast", "truthy-bool"]
