# .rumdl.toml
#
# The Markdown rules of the repository, read by rumdl (https://rumdl.dev)
# in `make lint-md` and in editors that know it.
# They follow the profile that every repository of the maintainer copies:
# the rules of markdownlint keep their numbers and defaults, with these changes.

[global]
# Every rule comes on, the opt-in ones too:
# ALL names every rule of the rumdl that runs, so a newer rumdl brings its new rules in.
extend-enable = ["ALL"]
# Three rules stay off. MD063 checks the case of a heading, but it lowers
# a proper name, such as Claude Code or English, and raises the name of a tool,
# such as rumdl, so sentence case is held by review.
# MD072 sorts the keys of frontmatter, where the docs of Claude Code
# put name and description first.
# MD085 flags a paragraph line that starts with spaces,
# but a record of docs goes on with a line indented by two spaces.
extend-disable = ["MD063", "MD072", "MD085"]
# [code-block-tools] keeps its default, enabled = false: it runs a linter on each code block,
# and the blocks of the docs are short fragments, not programs.

# MD088 would put a hyphen where the dash was,
# and a hyphen between spaces is a dash too:
# the sentence takes a comma, a colon or a full stop instead.
# rumdl fixes all of MD088 or none of it, so a curly quote is changed by hand too.
unfixable = ["MD088"]
# A file takes milliseconds, so a cache would only leave
# a .rumdl_cache folder in the repository.
cache = false

[MD004]
# A list takes `-`, as every file here does.
style = "dash"

[MD009]
# A break inside a paragraph is a backslash at the end of the line:
# two trailing spaces make one too, but nobody sees them.
br-spaces = 0
# strict also flags the spaces at the end of a line in a code block,
# which no file here holds either.
strict = true

[MD013]
# Lines break where a reader pauses, with no fixed length,
# so the limit only catches a paragraph left on one line.
# stern flags every long line that a break would help,
# and lets a lone URL run on; code blocks and tables may run longer.
line-length = 100
code-blocks = false
stern = true

[MD033]
# A README may fold long sections, name keys,
# and give an image in a light and a dark version;
# <b> and <code> mark up a <summary>, where Markdown does not render.
# Nothing else needs HTML: a title is a plain #, never centered.
allowed-elements = ["b", "code", "details", "img", "kbd", "picture", "source", "summary"]

[MD050]
# Bold takes `**`, as every file here does.
style = "asterisk"

[MD060]
# Tables are aligned, so their source reads like the rendered page;
# rumdl fmt aligns them.
style = "aligned"

[MD073]
# The list of Contents names the sections of a doc, the headings of level 2.
max-level = 2

[MD080]
# The CHANGELOG follows Keep a Changelog,
# which repeats ### Added and ### Changed under each release.
levels = [1, 2]

[MD082]
# In the CHANGELOG, the heading of a release only opens its ### sections.
allow-parent-headings = true

[MD088]
# The em dash, the en dash and the curly quotes stay out of files, as CLAUDE.md says.
# MD088 leaves the guillemets alone, as real quotes of some languages,
# and MD061 cannot match a sign, so review alone keeps them out.
normalize-dashes = true
normalize-quotes = true

[MD093]
# A literal in a heading goes into a code span, as each literal does.
code = false

[per-file-ignores]
# Keep a Changelog keeps an empty ## [Unreleased] after each release.
# allow-parent-headings does not pass it, since the next heading is a ## too,
# and level = 3 of MD082 would pass an empty ## section in every file.
"**/CHANGELOG.md" = ["MD082"]
